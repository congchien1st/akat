<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài nguyên</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons (replacing lucide-react) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!--    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>-->
    <!-- Custom CSS -->
    <link rel="stylesheet" href="resources.css">

</head>
<body>
<div class="main-container">
    <!-- Header Section -->
    <div class="mb-4">
        <div class="row align-items-center mb-4">
            <div class="col-md-8">
                <h1 class="fw-bold mb-2">Quản lý tài nguyên</h1>
                <p class="text-secondary">
                    Tổng quan về hiệu suất và quản lý các trang Facebook đã kết nối
                </p>
            </div>
            <div class="col-md-4 text-md-end">
                <div class="date-selector">
                    <i class="fas fa-calendar date-icon"></i>
                    <select id="dateRange" class="form-select">
                        <option value="7">7 ngày gần nhất</option>
                        <option value="30" selected>30 ngày gần nhất</option>
                        <option value="90">90 ngày gần nhất</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Error Message (hidden by default) -->
        <div id="errorAlert" class="error-alert" style="display: none;">
            <i class="fas fa-circle-exclamation"></i>
            <div id="errorMessage"></div>
        </div>
    </div>

    <!-- Stats Dashboard -->
    <div class="row g-3 mb-4" id="statsContainer">
        <!-- Stats will be generated here by jQuery -->
    </div>

    <!-- Facebook Pages Section -->
    <div class="page-section">
        <div class="section-header">
            <h2 class="section-title">Facebook Pages đã kết nối</h2>
            <div class="section-actions">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Tìm kiếm trang..." class="form-control search-input">
                </div>
                <button id="exportBtn" class="btn btn-action btn-export">
                    <i class="fas fa-download"></i>
                    <span>Xuất</span>
                </button>
                <button id="addPageBtn" class="btn btn-action btn-add">
                    <i class="fas fa-plus"></i>
                    <span>Thêm Page</span>
                </button>
            </div>
        </div>

        <!-- Loading Spinner (shown initially) -->
        <div id="loadingSpinner" class="loading-spinner">
            <i class="fas fa-spinner spinning fa-2x text-primary"></i>
        </div>

        <!-- Pages Container (hidden initially) -->
        <div id="pagesContainer" style="display: none;">
            <!-- Facebook Page Cards will be generated here by jQuery -->
        </div>

        <!-- Empty State (hidden initially) -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <i class="fab fa-facebook empty-icon"></i>
            <p class="text-secondary">Không tìm thấy trang nào</p>
        </div>
    </div>
</div>

<!-- Add Page Modal (hidden by default) -->
<div id="addPageModal" class="modal-backdrop" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">Thêm Facebook Page</h3>
            <button id="closeAddPageModal" class="modal-close">
                <i class="fas fa-xmark"></i>
            </button>
        </div>
        <p class="text-secondary mb-4">Kết nối Facebook Page của bạn để quản lý và theo dõi hiệu suất.</p>
        <button class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2">
            <i class="fab fa-facebook"></i>
            <span>Kết nối với Facebook</span>
        </button>
    </div>
</div>

<!-- Export Modal (hidden by default) -->
<div id="exportModal" class="modal-backdrop" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">Xuất báo cáo</h3>
            <button id="closeExportModal" class="modal-close">
                <i class="fas fa-xmark"></i>
            </button>
        </div>
        <p class="text-secondary mb-4">Chọn định dạng và phạm vi dữ liệu để xuất báo cáo.</p>
        <div class="mb-3">
            <label class="form-label">Định dạng</label>
            <select class="form-select mb-3">
                <option value="xlsx">Excel (XLSX)</option>
                <option value="csv">CSV</option>
                <option value="pdf">PDF</option>
            </select>
            <label class="form-label">Thời gian</label>
            <select class="form-select mb-4">
                <option value="7">7 ngày gần nhất</option>
                <option value="30" selected>30 ngày gần nhất</option>
                <option value="90">90 ngày gần nhất</option>
                <option value="custom">Tùy chỉnh</option>
            </select>
        </div>
        <button class="btn btn-primary w-100">Tải xuống</button>
    </div>
</div>

<!-- jQuery and Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script  type="module"  src="./resource-page.js"></script>
</body>
</html>
